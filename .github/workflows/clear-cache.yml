name: Clear Actions Cache

# Manual cache-clearing utility — see "CI Overview" in
# docs/DEPLOYMENT.md. Useful when a stale npm/Gradle cache is
# suspected of causing a build to misbehave and a re-run alone doesn't
# clear it (Actions caches aren't invalidated just by re-running).
on:
  workflow_dispatch:
    inputs:
      key_prefix:
        description: 'Only delete caches whose key starts with this (leave blank to delete all caches for this repo)'
        required: false
        default: ''

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY_PREFIX: ${{ github.event.inputs.key_prefix }}
        run: |
          set -e
          echo "Listing caches..."
          gh cache list --repo "${{ github.repository }}" --limit 100 --json id,key \
            | jq -r --arg prefix "$KEY_PREFIX" '.[] | select(.key | startswith($prefix)) | .id' \
            > cache_ids.txt

          if [ ! -s cache_ids.txt ]; then
            echo "No matching caches found."
            exit 0
          fi

          while read -r id; do
            echo "Deleting cache id $id"
            gh cache delete "$id" --repo "${{ github.repository }}" || true
          done < cache_ids.txt
