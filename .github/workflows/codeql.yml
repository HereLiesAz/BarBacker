# centralized-by: HereLiesAz/workflows
# central-source-path: .github/workflows/codeql.yml
# central-source-sha256: e16a42da22d3d1d1fcc2027f8904587003b09a058f1ace5135d131a4eac2b288
# This file intentionally contains no repository secrets.
name: CodeQL Advanced
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '42 4 * * 5'

# Auto-generated setup had no concurrency control at all: a push to
# main and every PR push each started their own set of scans with
# nothing to cancel a superseded one, so rapid merges (this repo
# routinely opens and merges PRs within minutes) left several runs —
# some already stale — piling up in_progress simultaneously. head_ref
# (set for pull_request events, the PR's source branch) falls back to
# ref (push/schedule/workflow_dispatch) so a PR's own re-pushes cancel
# their own previous scan without colliding with main's group.
permissions:
  contents: read
  id-token: write
jobs:
  central-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to HereLiesAz/workflows
        env:
          WORKFLOWS_GATEWAY_URL: ${{ vars.WORKFLOWS_GATEWAY_URL }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
          VARS_JSON: ${{ toJSON(vars) }}
          SOURCE_WORKFLOW_PATH: .github/workflows/codeql.yml
          SOURCE_SHA256: e16a42da22d3d1d1fcc2027f8904587003b09a058f1ace5135d131a4eac2b288
        shell: bash
        run: "set -euo pipefail\n[[ -n \"${WORKFLOWS_GATEWAY_URL:-}\" ]] || { echo \"Repository variable WORKFLOWS_GATEWAY_URL is not configured.\" >&2; exit 1; }\noidc_response=\"$(curl --fail-with-body --silent --show-error -H \"Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}\" \"${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hereliesaz-workflows\")\"\noidc_token=\"$(jq -r '.value // empty' <<<\"$oidc_response\")\"\n[[ -n \"$oidc_token\" ]] || { echo \"GitHub did not issue an OIDC token.\" >&2; exit 1; }\necho \"::add-mask::$oidc_token\"\nif [[ \"$GITHUB_EVENT_NAME\" == \"pull_request\" || \"$GITHUB_EVENT_NAME\" == \"pull_request_target\" ]]; then\n  DISPATCH_EVENT_JSON=\"$(jq -c '{\n    action,\n    number,\n    pull_request: {\n      number: .pull_request.number,\n      base: {\n        ref: .pull_request.base.ref,\n        sha: .pull_request.base.sha\n      },\n      head: {\n        ref: .pull_request.head.ref,\n        sha: .pull_request.head.sha,\n        repo: {\n          full_name: .pull_request.head.repo.full_name,\n          fork: (.pull_request.head.repo.fork // false)\n        }\n      }\n    }\n  }' <<<\"$EVENT_JSON\")\"\nelse\n  DISPATCH_EVENT_JSON=\"$EVENT_JSON\"\nfi\npayload=\"$(jq -n   --arg repository \"$GITHUB_REPOSITORY\" --arg repository_id \"$GITHUB_REPOSITORY_ID\"   --arg repository_owner \"$GITHUB_REPOSITORY_OWNER\" --arg repository_owner_id \"$GITHUB_REPOSITORY_OWNER_ID\"   --arg sha \"$GITHUB_SHA\" --arg ref \"$GITHUB_REF\" --arg ref_name \"$GITHUB_REF_NAME\" --arg ref_type \"$GITHUB_REF_TYPE\"   --arg head_ref \"$GITHUB_HEAD_REF\" --arg base_ref \"$GITHUB_BASE_REF\" --arg actor \"$GITHUB_ACTOR\" --arg actor_id \"$GITHUB_ACTOR_ID\"   --arg event_name \"$GITHUB_EVENT_NAME\" --arg run_id \"$GITHUB_RUN_ID\" --arg run_number \"$GITHUB_RUN_NUMBER\" --arg run_attempt \"$GITHUB_RUN_ATTEMPT\"   --arg workflow_ref \"$GITHUB_WORKFLOW_REF\" --arg workflow_name \"$GITHUB_WORKFLOW\" --arg source_workflow_path \"$SOURCE_WORKFLOW_PATH\"   --arg source_sha256 \"$SOURCE_SHA256\" --argjson event \"$DISPATCH_EVENT_JSON\" --argjson inputs \"$INPUTS_JSON\" --argjson vars \"$VARS_JSON\"   '{repository:$repository,repository_id:$repository_id,repository_owner:$repository_owner,repository_owner_id:$repository_owner_id,sha:$sha,check_sha:($event.pull_request.head.sha // $sha),ref:$ref,ref_name:$ref_name,ref_type:$ref_type,head_ref:$head_ref,base_ref:$base_ref,actor:$actor,actor_id:$actor_id,event_name:$event_name,event:$event,inputs:$inputs,vars:$vars,run_id:$run_id,run_number:$run_number,run_attempt:$run_attempt,workflow_ref:$workflow_ref,workflow_name:$workflow_name,source_workflow_path:$source_workflow_path,source_sha256:$source_sha256}')\"\ncurl --fail-with-body --silent --show-error -X POST \"${WORKFLOWS_GATEWAY_URL%/}/dispatch\" -H \"Authorization: Bearer ${oidc_token}\" -H \"Content-Type: application/json\" --data-binary \"$payload\""
    name: Dispatch
