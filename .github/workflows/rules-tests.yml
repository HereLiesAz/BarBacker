name: Rules & Functions Tests

# The PR-side build/test signal for the whole repo — see "CI Overview"
# in docs/DEPLOYMENT.md. Runs the client unit suite, the Firestore/
# Storage security-rules suite (against the Firebase emulator), and
# the Cloud Functions build + unit suite. Without this, a rules change
# that opens a hole, or a functions change that doesn't even compile,
# merges with zero automated signal.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  client-and-rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Client unit tests
        run: npm test -- --run

      # The Firebase emulator suite (firebase-tools 14+) requires JDK 21+
      # to run the Firestore/Storage emulators — ubuntu-latest's default
      # Java is older, and firebase-tools fails outright without it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Firestore + Storage rules tests
        run: npm run test:rules

  functions-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test
