apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.HereLiesAz.BarBacker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.HereLiesAz.BarBacker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // build-mobile.yml's "Compute Version" step passes these as
        // -P properties (versionBuild = total commit count, a
        // monotonically increasing integer valid as versionCode).
        // Previously these were hardcoded to 1/"1.0" — the workflow
        // computed a real version but nothing here ever read it, so
        // every APK ever built, regardless of commit, reported the
        // same versionCode/versionName. Falls back to 1/"1.0-dev" for
        // a plain local `./gradlew assembleDebug` with no properties
        // passed, so local development builds still work.
        versionCode project.hasProperty('versionBuild') ? (project.property('versionBuild') as Integer) : 1
        versionName project.hasProperty('versionBuild')
            ? "${project.property('versionMajor')}.${project.property('versionMinor')}.${project.property('versionPatch')}.${project.property('versionBuild')}"
            : "1.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Apply the Google Services plugin, which compiles google-services.json
// into the string resources (google_app_id, gcm_defaultSenderId, ...)
// that FirebaseInitProvider reads at startup to create the default
// FirebaseApp.
//
// This used to swallow a missing file with logger.info() and carry on.
// The resulting APK builds and installs cleanly but has no Firebase
// configuration in it at all, so FirebaseInitProvider silently gives up
// and the first PushNotifications.register() call — which does
// FirebaseMessaging.getInstance() — throws
//
//   java.lang.IllegalStateException: Default FirebaseApp is not
//   initialized in this process com.HereLiesAz.BarBacker.
//
// That exception is raised inside Capacitor's Bridge on a handler
// thread and rethrown as a RuntimeException, so it is an uncaught
// native crash: the try/catch around the JS call site cannot see it,
// and the app dies. A build that cannot produce a working app must
// fail here instead of shipping that.
//
// Pass -PallowMissingGoogleServices for a local build with no Firebase
// secrets to hand; the app then detects the missing config at runtime
// (FirebaseConfigPlugin) and skips push registration rather than
// crashing.
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && !servicesJSON.text.trim().isEmpty()) {
    apply plugin: 'com.google.gms.google-services'
} else if (project.hasProperty('allowMissingGoogleServices')) {
    logger.lifecycle("google-services.json is missing — building WITHOUT Firebase. Push notifications will be disabled at runtime.")
} else {
    throw new GradleException(
        "android/app/google-services.json is missing or empty. Without it the APK ships with no Firebase " +
        "configuration and crashes the first time push notifications are registered.\n" +
        "  CI: the 'Generate google-services.json' step in .github/workflows/build-mobile.yml must run first.\n" +
        "  Locally: run `node scripts/generate-google-services.js` with the Firebase env vars set (see docs/DEPLOYMENT.md),\n" +
        "           or build with -PallowMissingGoogleServices to accept an APK with push notifications disabled."
    )
}
